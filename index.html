<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResiCat - Skaner Rezystorów</title>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/ort.min.js"></script>
    <style>
        :root {
            --bg-color: #161622;
            --card-bg: #222234;
            --accent-blue: #40c4ff;
            --accent-pink: #ff7eb3;
            --accent-mint: #4ecca3;
            --accent-yellow: #ffd369;
            --text-main: #ffffff;
            --text-muted: #a0a0b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .app-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 15px;
        }

        .app-title {
            font-size: 44px;
            font-weight: 900;
            letter-spacing: 6px;
            color: var(--text-main);
            margin: 0;
            text-transform: uppercase;
            display: flex;
            align-items: flex-end;
            text-shadow: 0 2px 20px rgba(64, 196, 255, 0.4);
        }

        .letter-i-container {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            margin: 0 -2px;
        }

        .cat-paw-dot {
            width: 24px;                  
            height: 22px;                 
            margin-bottom: 2px;           
            transform: rotate(12deg);     
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 5px;
            min-height: 45px;
            flex-wrap: wrap;
        }

        #status-text {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--accent-yellow);
            text-transform: uppercase;
            margin: 0;
            transition: color 0.3s;
        }

        #status-text.found {
            color: var(--accent-mint);
            text-shadow: 0 0 12px rgba(78, 204, 163, 0.4);
        }

        #reset-btn {
            display: none;
            background: var(--accent-pink);
            color: #161622;
            border: none;
            border-radius: 12px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 126, 179, 0.4);
            transition: transform 0.15s;
            text-transform: uppercase;
        }

        #reset-btn:active {
            transform: scale(0.95);
        }

        .cat-container {
            width: 240px;
            height: 160px;
            margin: 5px auto 10px auto;
        }

        @keyframes lookAroundSafe {
            0%, 100% { transform: translate(0px, 0px); }
            25% { transform: translate(-2px, 1px); }
            75% { transform: translate(2px, 1px); }
        }

        @keyframes happyEarLeft {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-10deg) translateY(-2px); }
        }

        @keyframes happyEarRight {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(10deg) translateY(-2px); }
        }

        @keyframes glowEyes {
            0%, 100% { filter: drop-shadow(0 0 2px var(--accent-mint)); transform: scale(1); }
            50% { filter: drop-shadow(0 0 10px var(--accent-mint)); transform: scale(1.05); }
        }

        @keyframes happyBlink {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        .searching .pupils-moving {
            animation: lookAroundSafe 2.4s ease-in-out infinite;
        }

        .found .ear-left-group {
            animation: happyEarLeft 0.8s ease-in-out infinite;
            transform-origin: 52px 38px;
        }
        .found .ear-right-group {
            animation: happyEarRight 0.8s ease-in-out infinite;
            transform-origin: 178px 38px;
        }

        .found .happy-eyes-anim {
            animation: glowEyes 1.5s ease-in-out infinite, happyBlink 1s ease-in-out infinite;
            transform-origin: center;
        }

        /* Lekko pochylone, symetryczne brwi w trybie sukcesu */
        .found .eyebrow-left-found {
            transform: translateY(-7px) rotate(-15deg);
            transform-origin: 70px 45px;
            transition: transform 0.3s ease;
        }
        .found .eyebrow-right-found {
            transform: translateY(-7px) rotate(15deg);
            transform-origin: 160px 45px;
            transition: transform 0.3s ease;
        }

        .camera-label {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .camera-box {
            position: relative;
            width: 100%;
            max-width: 340px;
            aspect-ratio: 4 / 3;
            background: #0d0d14;
            border-radius: 18px;
            border: 3px solid #33334d;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .camera-box.found {
            border-color: var(--accent-mint);
            box-shadow: 0 0 20px rgba(78, 204, 163, 0.35);
        }

        video, #frozen-frame {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        #frozen-frame {
            display: none;
        }

        #info-card {
            display: none;
            width: 100%;
            max-width: 340px;
            background: var(--card-bg);
            border-left: 5px solid var(--accent-mint);
            border-radius: 14px;
            padding: 16px 18px;
            margin-top: 18px;
            box-sizing: border-box;
            text-align: left;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .info-title {
            font-size: 16px;
            font-weight: 800;
            color: var(--accent-mint);
            letter-spacing: 1.5px;
            margin: 0 0 10px 0;
        }

        .info-row {
            font-size: 15px;
            margin: 6px 0;
            color: var(--text-main);
        }

        .info-row span {
            color: var(--accent-yellow);
            font-weight: 700;
        }

        #model-status {
            margin-top: 12px;
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
        }
    </style>
</head>
<body>

    <header class="app-header">
        <h1 class="app-title">
            RES<span class="letter-i-container">
                <svg class="cat-paw-dot" viewBox="0 0 32 30" width="100%" height="100%">
                    <path d="M 16 14 C 11 9, 6 12, 6 17 C 6 21, 11 25, 16 28 C 21 25, 26 21, 26 17 C 26 12, 21 9, 16 14 Z" fill="var(--accent-blue)"/>
                    <circle cx="8" cy="8" r="3.5" fill="var(--accent-blue)"/>
                    <circle cx="13" cy="5" r="3.5" fill="var(--accent-blue)"/>
                    <circle cx="19" cy="5" r="3.5" fill="var(--accent-blue)"/>
                    <circle cx="24" cy="8" r="3.5" fill="var(--accent-blue)"/>
                </svg>
                I
            </span>CAT
        </h1>
    </header>

    <div class="top-bar">
        <h1 id="status-text">ŁADOWANIE...</h1>
        <button id="reset-btn" onclick="resetScanner()">Szukaj ponownie</button>
    </div>

    <div id="cat-wrapper" class="cat-container searching">
        <svg viewBox="0 0 230 160" width="100%" height="100%">
            <g class="ear-left-group">
                <path d="M 40 45 L 52 8 L 80 34" fill="none" stroke="var(--accent-blue)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
            <g class="ear-right-group">
                <path d="M 190 45 L 178 8 L 150 34" fill="none" stroke="var(--accent-blue)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
            
            <!-- Standardowe brwi -->
            <g id="eyebrows-searching">
                <ellipse class="eyebrow-left" cx="70" cy="45" rx="14" ry="5" fill="none" stroke="var(--accent-blue)" stroke-width="4" stroke-linecap="round"/>
                <ellipse class="eyebrow-right" cx="160" cy="45" rx="14" ry="5" fill="none" stroke="var(--accent-blue)" stroke-width="4" stroke-linecap="round"/>
            </g>

            <!-- Lekko pochylone, symetryczne brwi w trybie MAM!!! -->
            <g id="eyebrows-found" style="display: none;">
                <ellipse class="eyebrow-left-found" cx="70" cy="45" rx="14" ry="5" fill="none" stroke="var(--accent-mint)" stroke-width="4" stroke-linecap="round"/>
                <ellipse class="eyebrow-right-found" cx="160" cy="45" rx="14" ry="5" fill="none" stroke="var(--accent-mint)" stroke-width="4" stroke-linecap="round"/>
            </g>

            <g id="eyes-searching">
                <circle cx="70" cy="82" r="25" fill="var(--accent-blue)"/>
                <circle cx="160" cy="82" r="25" fill="var(--accent-blue)"/>
                <g class="pupils-moving">
                    <circle cx="70" cy="82" r="21" fill="var(--bg-color)"/>
                    <circle cx="62" cy="73" r="7" fill="#ffffff"/>
                    <circle cx="79" cy="91" r="3" fill="rgba(255,255,255,0.6)"/>
                </g>
                <g class="pupils-moving">
                    <circle cx="160" cy="82" r="21" fill="var(--bg-color)"/>
                    <circle cx="152" cy="73" r="7" fill="#ffffff"/>
                    <circle cx="169" cy="91" r="3" fill="rgba(255,255,255,0.6)"/>
                </g>
            </g>

            <g id="eyes-found" class="happy-eyes-anim" style="display: none;">
                <path d="M 48 82 Q 70 58 92 82" fill="none" stroke="var(--accent-mint)" stroke-width="6" stroke-linecap="round"/>
                <path d="M 138 82 Q 160 58 182 82" fill="none" stroke="var(--accent-mint)" stroke-width="6" stroke-linecap="round"/>
            </g>

            <line x1="18" y1="92" x2="36" y2="89" stroke="var(--accent-blue)" stroke-width="4" stroke-linecap="round"/>
            <line x1="16" y1="103" x2="34" y2="102" stroke="var(--accent-blue)" stroke-width="4" stroke-linecap="round"/>
            <line x1="20" y1="114" x2="36" y2="111" stroke="var(--accent-blue)" stroke-width="4" stroke-linecap="round"/>

            <line x1="212" y1="92" x2="194" y2="89" stroke="var(--accent-blue)" stroke-width="4" stroke-linecap="round"/>
            <line x1="214" y1="103" x2="196" y2="102" stroke="var(--accent-blue)" stroke-width="4" stroke-linecap="round"/>
            <line x1="210" y1="114" x2="194" y2="111" stroke="var(--accent-blue)" stroke-width="4" stroke-linecap="round"/>

            <polygon points="112,102 122,102 117,110" fill="var(--accent-blue)"/>

            <g id="mouth-searching">
                <path d="M 108 116 Q 113 121 117 116 Q 121 121 126 116" fill="none" stroke="var(--accent-blue)" stroke-width="4" stroke-linecap="round"/>
            </g>

            <g id="mouth-found" style="display: none;">
                <path d="M 100 114 Q 117 138 134 114 Z" fill="var(--accent-mint)" stroke="var(--bg-color)" stroke-width="2" stroke-linejoin="round"/>
                <polygon points="108,116 113,126 118,116" fill="#ffffff"/>
            </g>
        </svg>
    </div>

    <div class="camera-label">KAMERA</div>
    <div id="camera-box" class="camera-box">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="frozen-frame"></canvas>
    </div>

    <div id="info-card">
        <div class="info-title">INFO:</div>
        <div id="info-content"></div>
    </div>

    <div id="model-status">Inicjalizacja modelu AI...</div>
    <canvas id="ai-canvas" width="320" height="320" style="display:none;"></canvas>

    <script>
        const CLASS_NAMES = [
            "Czarny", "Brązowy", "Czerwony", "Pomarańczowy", 
            "Żółty", "Zielony", "Niebieski", "Fioletowy", 
            "Szary", "Biały", "Złoty", "Srebrny", "Rezystor"
        ];

        const COLOR_VALUES = {
            "Czarny": { digit: 0, mult: 1, tempCoeff: 250 },
            "Brązowy": { digit: 1, mult: 10, tol: 1, tempCoeff: 100 },
            "Czerwony": { digit: 2, mult: 100, tol: 2, tempCoeff: 50 },
            "Pomarańczowy": { digit: 3, mult: 1000, tempCoeff: 15 },
            "Żółty": { digit: 4, mult: 10000, tempCoeff: 25 },
            "Zielony": { digit: 5, mult: 100000, tol: 0.5, tempCoeff: 20 },
            "Niebieski": { digit: 6, mult: 1000000, tol: 0.25, tempCoeff: 10 },
            "Fioletowy": { digit: 7, mult: 10000000, tol: 0.1, tempCoeff: 5 },
            "Szary": { digit: 8, mult: 100000000, tol: 0.05 },
            "Biały": { digit: 9, mult: 1000000000 },
            "Złoty": { mult: 0.1, tol: 5 },
            "Srebrny": { mult: 0.01, tol: 10 }
        };

        let session = null;     
        let isScanning = false; 
        let resistorStableCount = 0; 
        const video = document.getElementById('webcam');
        const frozenCanvas = document.getElementById('frozen-frame');
        const aiCanvas = document.getElementById('ai-canvas');
        const aiCtx = aiCanvas.getContext('2d', { willReadFrequently: true });

        async function initApp() {
            try {
                ort.env.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/";
                ort.env.wasm.numThreads = 1;
                
                session = await ort.InferenceSession.create('./best.onnx');
                document.getElementById('model-status').innerText = 'AI gotowe • rozdzielczość 320x320';
                await startCamera(); 
            } catch (e) {
                console.error("Błąd modelu:", e);
                document.getElementById('model-status').innerText = 'Błąd ładowania best.onnx';
            }
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' } 
                });
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    isScanning = true;
                    setSearchingUI();
                    scanLoop(); 
                };
            } catch (err) {
                document.getElementById('status-text').innerText = 'BRAK KAMERY';
                document.getElementById('model-status').innerText = 'Zezwól na dostęp do aparatu.';
            }
        }

        async function scanLoop() {
            if (!isScanning || !session) return;

            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                aiCtx.drawImage(video, 0, 0, 320, 320); 
                const imgData = aiCtx.getImageData(0, 0, 320, 320).data;

                const float32Data = new Float32Array(3 * 320 * 320);
                for (let i = 0; i < 320 * 320; i++) {
                    float32Data[i] = imgData[i * 4] / 255.0;                  
                    float32Data[i + 320 * 320] = imgData[i * 4 + 1] / 255.0;  
                    float32Data[i + 2 * 320 * 320] = imgData[i * 4 + 2] / 255.0;
                }

                const inputTensor = new ort.Tensor('float32', float32Data, [1, 3, 320, 320]);
                
                try {
                    const feeds = {};
                    feeds[session.inputNames[0]] = inputTensor;
                    const results = await session.run(feeds); 
                    const output = results[session.outputNames[0]].data;
                    const dims = results[session.outputNames[0]].dims;

                    // Podniesiono próg pewności do 0.75 (75%), aby odrzucić losowe fałszywe wykrycia
                    const detections = parseYOLOOutput(output, dims, 0.75); 

                    const colorDetections = detections.filter(d => d.label !== "Rezystor");

                    // Wymagamy minimum 3 pewnych pasków ułożonych w linii, aby odrzucić przypadkowe obiekty
                    if (colorDetections.length >= 3) {
                        resistorStableCount++;
                        if (resistorStableCount >= 4) {
                            handleResistorFound(colorDetections); 
                            return;
                        }
                    } else {
                        resistorStableCount = Math.max(0, resistorStableCount - 1);
                    }
                } catch (err) {
                    console.error("Błąd detekcji:", err);
                }
            }

            setTimeout(() => requestAnimationFrame(scanLoop), 150); 
        }

        function parseYOLOOutput(data, dims, confThreshold) {
            const numFeatures = dims[1];
            const numAnchors = dims[2];
            const numClasses = numFeatures - 4;
            let found = [];

            for (let i = 0; i < numAnchors; i++) {
                let maxScore = 0;
                let classId = -1;

                for (let c = 0; c < numClasses; c++) {
                    const score = data[(4 + c) * numAnchors + i];
                    if (score > maxScore) {
                        maxScore = score;
                        classId = c;
                    }
                }

                if (maxScore > confThreshold) {
                    const label = CLASS_NAMES[classId] || `Klasa #${classId}`;
                    const xCenter = data[i]; 
                    if (!found.some(item => item.label === label)) {
                        found.push({
                            label: label,
                            confidence: Math.round(maxScore * 100),
                            x: xCenter
                        });
                    }
                }
            }
            return found;
        }

        function calculateResistor(bands) {
            bands.sort((a, b) => a.x - b.x);

            const firstLabel = bands[0].label;
            if (bands.length > 2 && (firstLabel === "Złoty" || firstLabel === "Srebrny")) {
                bands.reverse();
            }

            let ohms = 0;
            let tolerance = "±5%";
            let tempCoeff = null;

            if (bands.length >= 4) {
                const d1 = COLOR_VALUES[bands[0].label]?.digit ?? 0;
                const d2 = COLOR_VALUES[bands[1].label]?.digit ?? 0;
                const mult = COLOR_VALUES[bands[2].label]?.mult ?? 1;
                ohms = (d1 * 10 + d2) * mult;

                const tolColor = bands[3].label;
                if (COLOR_VALUES[tolColor]?.tol !== undefined) {
                    tolerance = `±${COLOR_VALUES[tolColor].tol}%`;
                }

                if (bands.length >= 5) {
                    const d3 = COLOR_VALUES[bands[2].label]?.digit ?? 0;
                    const mult5 = COLOR_VALUES[bands[3].label]?.mult ?? 1;
                    ohms = (d1 * 100 + d2 * 10 + d3) * mult5;
                    const tolColor5 = bands[4].label;
                    if (COLOR_VALUES[tolColor5]?.tol !== undefined) {
                        tolerance = `±${COLOR_VALUES[tolColor5].tol}%`;
                    }
                }

                if (bands.length >= 6) {
                    const tcColor = bands[5].label;
                    if (COLOR_VALUES[tcColor]?.tempCoeff) {
                        tempCoeff = `${COLOR_VALUES[tcColor].tempCoeff} ppm/°C`;
                    }
                }
            } else if (bands.length === 3) {
                const d1 = COLOR_VALUES[bands[0].label]?.digit ?? 0;
                const d2 = COLOR_VALUES[bands[1].label]?.digit ?? 0;
                const mult = COLOR_VALUES[bands[2].label]?.mult ?? 1;
                ohms = (d1 * 10 + d2) * mult;
                tolerance = "±20%";
            }

            let formattedResistance = ohms + " Ω";
            if (ohms >= 1000000) {
                formattedResistance = (ohms / 1000000).toFixed(1).replace('.0', '') + " MΩ";
            } else if (ohms >= 1000) {
                formattedResistance = (ohms / 1000).toFixed(1).replace('.0', '') + " kΩ";
            }

            return {
                resistance: formattedResistance,
                tolerance: tolerance,
                tempCoeff: tempCoeff,
                orderedBands: bands
            };
        }

        function handleResistorFound(detections) {
            isScanning = false;

            frozenCanvas.width = video.videoWidth;
            frozenCanvas.height = video.videoHeight;
            const fCtx = frozenCanvas.getContext('2d');
            fCtx.drawImage(video, 0, 0, frozenCanvas.width, frozenCanvas.height);

            video.style.display = 'none';
            frozenCanvas.style.display = 'block';

            const statusText = document.getElementById('status-text');
            statusText.innerText = 'MAM!!!';
            statusText.classList.add('found');

            document.getElementById('reset-btn').style.display = 'block';
            document.getElementById('camera-box').classList.add('found');

            const cat = document.getElementById('cat-wrapper');
            cat.classList.remove('searching');
            cat.classList.add('found');

            document.getElementById('eyebrows-searching').style.display = 'none';
            document.getElementById('eyebrows-found').style.display = 'block';
            document.getElementById('eyes-searching').style.display = 'none';
            document.getElementById('eyes-found').style.display = 'block';
            document.getElementById('mouth-searching').style.display = 'none';
            document.getElementById('mouth-found').style.display = 'block';

            const result = calculateResistor(detections
