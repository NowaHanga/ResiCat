<script>
"use strict";

const CLASS_NAMES = [
    "Czarny", "Brązowy", "Czerwony", "Pomarańczowy",
    "Żółty", "Zielony", "Niebieski", "Fioletowy",
    "Szary", "Biały", "Złoty", "Srebrny", "Rezystor"
];

const COLOR_VALUES = {
    "Czarny": { digit: 0, mult: 1 },
    "Brązowy": { digit: 1, mult: 10, tol: 1, tempCoeff: 100 },
    "Czerwony": { digit: 2, mult: 100, tol: 2, tempCoeff: 50 },
    "Pomarańczowy": { digit: 3, mult: 1000, tempCoeff: 15 },
    "Żółty": { digit: 4, mult: 10000, tempCoeff: 25 },
    "Zielony": { digit: 5, mult: 100000, tol: 0.5, tempCoeff: 20 },
    "Niebieski": { digit: 6, mult: 1000000, tol: 0.25, tempCoeff: 10 },
    "Fioletowy": { digit: 7, mult: 10000000, tol: 0.1, tempCoeff: 5 },
    "Szary": { digit: 8, mult: 100000000, tol: 0.05 },
    "Biały": { digit: 9, mult: 1000000000 },
    "Złoty": { mult: 0.1, tol: 5 },
    "Srebrny": { mult: 0.01, tol: 10 }
};

const MODEL_SIZE = 320;
const COLOR_CONFIDENCE = 0.48;
const RESISTOR_CONFIDENCE = 0.55;

const STABILITY_REQUIRED = 5;
const STABILITY_WINDOW = 8;
const STABILITY_MAX_AGE_MS = 1400;
const STABILITY_MIN_SPAN_MS = 350;

const NMS_IOU_THRESHOLD = 0.45;

let session = null;
let isScanning = false;
let scanBusy = false;
let stabilityBuffer = [];
let mediaStream = null;
let torchOn = false;
let torchBusy = false;

const video = document.getElementById('webcam');
const frozenCanvas = document.getElementById('frozen-frame');
const aiCanvas = document.getElementById('ai-canvas');
const aiCtx = aiCanvas.getContext('2d', {
    willReadFrequently: true
});

async function initApp() {
    await startCamera();

    try {
        document.getElementById('model-status').innerText =
            'Ładowanie modelu AI...';

        ort.env.wasm.wasmPaths =
            "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/";

        ort.env.wasm.numThreads = 1;

        session = await ort.InferenceSession.create('./best.onnx');

        document.getElementById('model-status').innerText =
            'AI gotowe • stabilizacja aktywna';

        setSearchingUI();

        if (video.readyState >= HTMLMediaElement.HAVE_ENOUGH_DATA) {
            isScanning = true;
            scanLoop();
        }

    } catch (e) {
        console.error("Błąd ładowania modelu:", e);

        document.getElementById('model-status').innerText =
            'Błąd wczytywania best.onnx';
    }
}

async function startCamera() {
    try {
        if (!navigator.mediaDevices?.getUserMedia) {
            throw new Error('Brak obsługi kamery.');
        }

        mediaStream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: {
                facingMode: { ideal: 'environment' },
                width: { ideal: 1280 },
                height: { ideal: 960 }
            }
        });

        video.srcObject = mediaStream;
        await video.play();

        if (session && !isScanning) {
            isScanning = true;
            scanLoop();
        }

    } catch (err) {
        console.error("Błąd kamery:", err);

        document.getElementById('status-label').innerText =
            'BRAK KAMERY';

        document.getElementById('model-status').innerText =
            'Zezwól przeglądarce na dostęp do aparatu.';
    }
}

// LATARKA

async function toggleFlashlight() {
    if (!mediaStream || torchBusy) return;

    const track = mediaStream.getVideoTracks()[0];

    const capabilities = track.getCapabilities
        ? track.getCapabilities()
        : {};

    if (!capabilities.torch) {
        alert('Twoje urządzenie nie obsługuje latarki.');
        return;
    }

    torchBusy = true;

    const requestedState = !torchOn;

    try {
        await track.applyConstraints({
            advanced: [{ torch: requestedState }]
        });

        torchOn = requestedState;
        updateFlashlightUI();

    } catch (err) {
        console.error('Błąd latarki:', err);

    } finally {
        torchBusy = false;
    }
}

async function turnOffFlashlight() {
    if (!mediaStream || !torchOn) return;

    const track = mediaStream.getVideoTracks()[0];

    try {
        if (track && track.readyState === 'live') {
            await track.applyConstraints({
                advanced: [{ torch: false }]
            });
        }

    } catch (err) {
        console.warn('Nie udało się wyłączyć latarki:', err);

    } finally {
        torchOn = false;
        updateFlashlightUI();
    }
}

function updateFlashlightUI() {
    const btn = document.getElementById('flashlight-btn');

    btn.classList.toggle('active', torchOn);
    btn.setAttribute('aria-pressed', String(torchOn));
}

// PĘTLA SKANOWANIA

function scheduleNextScan(delay = 70) {
    if (!isScanning) return;

    setTimeout(() => {
        requestAnimationFrame(scanLoop);
    }, delay);
}

async function scanLoop() {
    if (!isScanning || scanBusy) return;

    if (!session ||
        video.readyState < HTMLMediaElement.HAVE_ENOUGH_DATA) {
        scheduleNextScan(150);
        return;
    }

    scanBusy = true;

    try {
        aiCtx.drawImage(video, 0, 0, MODEL_SIZE, MODEL_SIZE);

        const imgData = aiCtx.getImageData(
            0, 0, MODEL_SIZE, MODEL_SIZE
        ).data;

        const plane = MODEL_SIZE * MODEL_SIZE;
        const float32Data = new Float32Array(3 * plane);

        for (let i = 0; i < plane; i++) {
            float32Data[i] = imgData[i * 4] / 255;
            float32Data[i + plane] = imgData[i * 4 + 1] / 255;
            float32Data[i + plane * 2] = imgData[i * 4 + 2] / 255;
        }

        const inputTensor = new ort.Tensor(
            'float32',
            float32Data,
            [1, 3, MODEL_SIZE, MODEL_SIZE]
        );

        const feeds = {};
        feeds[session.inputNames[0]] = inputTensor;

        const results = await session.run(feeds);
        const outputTensor = results[session.outputNames[0]];

        const detections = parseYOLOOutput(
            outputTensor.data,
            outputTensor.dims
        );

        const candidate = findBestBandGroup(detections);

        updateStability(candidate);

        const stableGroup = getStableGroup();

        if (stableGroup) {
            await handleResistorFound(stableGroup);
            return;
        }

    } catch (err) {
        console.error('Błąd detekcji:', err);

        stabilityBuffer.push({
            time: Date.now(),
            group: null
        });

        trimStabilityBuffer();

    } finally {
        scanBusy = false;
    }

    scheduleNextScan(70);
}

// ODCZYT WYJŚCIA YOLO

function parseYOLOOutput(data, dims) {
    if (!dims || dims.length < 3) {
        throw new Error('Nieprawidłowy format YOLO.');
    }

    let features;
    let anchors;
    let featureMajor;

    if (dims[1] >= CLASS_NAMES.length + 4 &&
        dims[1] <= CLASS_NAMES.length + 5) {

        features = dims[1];
        anchors = dims[2];
        featureMajor = true;

    } else if (
        dims[2] >= CLASS_NAMES.length + 4 &&
        dims[2] <= CLASS_NAMES.length + 5
    ) {

        features = dims[2];
        anchors = dims[1];
        featureMajor = false;

    } else {
        throw new Error(
            'Nie można rozpoznać formatu wyjścia modelu.'
        );
    }

    const read = (anchor, feature) => {
        return featureMajor
            ? data[feature * anchors + anchor]
            : data[anchor * features + feature];
    };

    const raw = [];

    for (let i = 0; i < anchors; i++) {
        let bestScore = 0;
        let classId = -1;

        for (let c = 0; c < CLASS_NAMES.length; c++) {
            const score = read(i, 4 + c);

            if (score > bestScore) {
                bestScore = score;
                classId = c;
            }
        }

        if (classId < 0) continue;

        const label = CLASS_NAMES[classId];

        const threshold = label === 'Rezystor'
            ? RESISTOR_CONFIDENCE
            : COLOR_CONFIDENCE;

        if (bestScore < threshold) continue;

        let cx = read(i, 0);
        let cy = read(i, 1);
        let w = read(i, 2);
        let h = read(i, 3);

        if (Math.max(
            Math.abs(cx),
            Math.abs(cy),
            Math.abs(w),
            Math.abs(h)
        ) <= 2) {
            cx *= MODEL_SIZE;
            cy *= MODEL_SIZE;
            w *= MODEL_SIZE;
            h *= MODEL_SIZE;
        }

        if (![cx, cy, w, h].every(Number.isFinite)) continue;
        if (w <= 1 || h <= 1) continue;

        raw.push({
            label,
            classId,
            confidence: bestScore,
            x: cx,
            y: cy,
            w,
            h,
            x1: cx - w / 2,
            y1: cy - h / 2,
            x2: cx + w / 2,
            y2: cy + h / 2
        });
    }

    return nonMaximumSuppression(raw, NMS_IOU_THRESHOLD);
}

// USUWANIE NAKŁADAJĄCYCH SIĘ DETEKCJI

function boxIoU(a, b) {
    const x1 = Math.max(a.x1, b.x1);
    const y1 = Math.max(a.y1, b.y1);
    const x2 = Math.min(a.x2, b.x2);
    const y2 = Math.min(a.y2, b.y2);

    const intersection =
        Math.max(0, x2 - x1) * Math.max(0, y2 - y1);

    const union =
        a.w * a.h + b.w * b.h - intersection;

    return union > 0 ? intersection / union : 0;
}

function nonMaximumSuppression(detections, threshold) {
    const sorted = [...detections].sort(
        (a, b) => b.confidence - a.confidence
    );

    const kept = [];

    for (const detection of sorted) {
        const overlaps = kept.some(item =>
            item.classId === detection.classId &&
            boxIoU(item, detection) > threshold
        );

        if (!overlaps) kept.push(detection);
    }

    return kept;
}

// GEOMETRIA PASKÓW

function findBestBandGroup(detections) {
    const bands = detections
        .filter(d => d.label !== 'Rezystor')
        .filter(d => d.x > 18 && d.x < MODEL_SIZE - 18)
        .filter(d => d.y > 12 && d.y < MODEL_SIZE - 12)
        .filter(d => d.w >= 2 && d.h >= 3)
        .filter(d => d.h / d.w >= 0.55)
        .sort((a, b) => a.x - b.x);

    if (bands.length < 3) return null;

    const groups = [];

    for (
        let count = 3;
        count <= Math.min(6, bands.length);
        count++
    ) {
        for (
            let start = 0;
            start <= bands.length - count;
            start++
        ) {
            const group = bands.slice(start, start + count);

            const geometry = validateBandGeometry(group);

            if (!geometry.valid) continue;

            groups.push({
                bands: group,
                labels: group.map(b => b.label),
                xs: group.map(b => b.x / MODEL_SIZE),
                ys: group.map(b => b.y / MODEL_SIZE),
                score: geometry.score +
                    group.reduce(
                        (sum, b) => sum + b.confidence, 0
                    ) / count
            });
        }
    }

    groups.sort((a, b) => b.score - a.score);

    return groups[0] || null;
}

function validateBandGeometry(group) {
    const xs = group.map(b => b.x);
    const ys = group.map(b => b.y);
    const heights = group.map(b => b.h);
    const widths = group.map(b => b.w);

    const span = xs[xs.length - 1] - xs[0];

    const ySpread =
        Math.max(...ys) - Math.min(...ys);

    const median = arr => {
        const sorted = [...arr].sort((a, b) => a - b);
        return sorted[Math.floor(sorted.length / 2)];
    };

    const gaps = xs.slice(1).map(
        (x, i) => x - xs[i]
    );

    const medianGap = median(gaps);
    const medianHeight = median(heights);
    const medianWidth = median(widths);

    if (span < MODEL_SIZE * 0.10) return { valid: false };
    if (span > MODEL_SIZE * 0.78) return { valid: false };

    if (ySpread > MODEL_SIZE * 0.12) return { valid: false };

    if (medianGap < 5) return { valid: false };

    if (Math.max(...gaps) > medianGap * 3.2) {
        return { valid: false };
    }

    if (medianWidth > medianGap * 1.35) {
        return { valid: false };
    }

    if (medianHeight < 4) return { valid: false };

    if (medianHeight > MODEL_SIZE * 0.55) {
        return { valid: false };
    }

    if (
        Math.max(...heights) /
        Math.max(1, Math.min(...heights)) > 3.2
    ) {
        return { valid: false };
    }

    if (
        Math.max(...widths) /
        Math.max(1, Math.min(...widths)) > 4.5
    ) {
        return { valid: false };
    }

    const gapVariation = gaps.reduce(
        (sum, gap) => sum + Math.abs(gap - medianGap),
        0
    ) / gaps.length;

    const score =
        1 -
        ySpread / (MODEL_SIZE * 0.12) -
        gapVariation / Math.max(1, medianGap);

    return { valid: true, score };
}

// STABILIZACJA W CZASIE

function updateStability(candidate) {
    stabilityBuffer.push({
        time: Date.now(),

        group: candidate ? {
            labels: [...candidate.labels],
            xs: [...candidate.xs],
            ys: [...candidate.ys],
            bands: candidate.bands.map(b => ({ ...b }))
        } : null
    });

    trimStabilityBuffer();
}

function trimStabilityBuffer() {
    const cutoff = Date.now() - STABILITY_MAX_AGE_MS;

    stabilityBuffer = stabilityBuffer
        .filter(item => item.time >= cutoff)
        .slice(-STABILITY_WINDOW);
}

function getStableGroup() {
    const validFrames = stabilityBuffer.filter(
        item => item.group
    );

    if (validFrames.length < STABILITY_REQUIRED) {
        return null;
    }

    const latest = validFrames[validFrames.length - 1];

    const matching = validFrames.filter(item =>
        groupsMatch(item.group, latest.group)
    );

    if (matching.length < STABILITY_REQUIRED) {
        return null;
    }

    const selected = matching.slice(-STABILITY_REQUIRED);

    if (
        selected[selected.length - 1].time -
        selected[0].time < STABILITY_MIN_SPAN_MS
    ) {
        return null;
    }

    const count = latest.group.labels.length;
    const averagedBands = [];

    for (let i = 0; i < count; i++) {
        const samples = selected.map(
            item => item.group.bands[i]
        );

        const average = key =>
            samples.reduce(
                (sum, band) => sum + band[key], 0
            ) / samples.length;

        averagedBands.push({
            ...samples[samples.length - 1],
            x: average('x'),
            y: average('y'),
            w: average('w'),
            h: average('h'),
            confidence: average('confidence')
        });
    }

    return averagedBands;
}

function groupsMatch(a, b) {
    if (a.labels.length !== b.labels.length) return false;

    for (let i = 0; i < a.labels.length; i++) {
        if (a.labels[i] !== b.labels[i]) return false;

        if (Math.abs(a.xs[i] - b.xs[i]) > 0.045) {
            return false;
        }

        if (Math.abs(a.ys[i] - b.ys[i]) > 0.065) {
            return false;
        }
    }

    return true;
}

// OBLICZANIE REZYSTANCJI

function calculateResistor(bands) {
    const ordered = [...bands].sort(
        (a, b) => a.x - b.x
    );

    if (ordered.length < 3 || ordered.length > 6) {
        throw new Error('Nieprawidłowa liczba pasków.');
    }

    if (
        ordered.length >= 4 &&
        (
            ordered[0].label === 'Złoty' ||
            ordered[0].label === 'Srebrny'
        )
    ) {
        ordered.reverse();
    }

    const digitCount = ordered.length >= 5 ? 3 : 2;

    const digits = ordered
        .slice(0, digitCount)
        .map(b => COLOR_VALUES[b.label]?.digit);

    if (digits.some(value => value === undefined)) {
        throw new Error('Nieprawidłowy kolor cyfry.');
    }

    const multiplier =
        COLOR_VALUES[ordered[digitCount].label]?.mult;

    if (multiplier === undefined) {
        throw new Error('Nieprawidłowy mnożnik.');
    }

    let numericDigits = 0;

    for (const digit of digits) {
        numericDigits = numericDigits * 10 + digit;
    }

    const ohms = numericDigits * multiplier;

    let tolerance = '±20%';
    let tempCoeff = null;

    if (ordered.length >= 4) {
        const toleranceColor =
            ordered[digitCount + 1]?.label;

        const toleranceValue =
            COLOR_VALUES[toleranceColor]?.tol;

        if (toleranceValue === undefined) {
            throw new Error('Nieprawidłowy pasek tolerancji.');
        }

        tolerance = `±${toleranceValue}%`;
    }

    if (ordered.length === 6) {
        const tc = COLOR_VALUES[ordered[5].label]?.tempCoeff;

        if (tc !== undefined) {
            tempCoeff = `${tc} ppm/°C`;
        }
    }

    let formattedResistance = `${ohms} Ω`;

    if (ohms >= 1000000) {
        formattedResistance =
            `${(ohms / 1000000).toFixed(2)} MΩ`;
    } else if (ohms >= 1000) {
        formattedResistance =
            `${(ohms / 1000).toFixed(2)} kΩ`;
    }

    return {
        resistance: formattedResistance,
        tolerance,
        tempCoeff,
        orderedBands: ordered
    };
}

// SUKCES – MAM!!!

async function handleResistorFound(detections) {
    if (!isScanning) return;

    isScanning = false;
    stabilityBuffer = [];

    // Zamrożenie klatki przed wyłączeniem latarki.
    frozenCanvas.width = video.videoWidth || MODEL_SIZE;
    frozenCanvas.height = video.videoHeight || MODEL_SIZE;

    const fCtx = frozenCanvas.getContext('2d');

    fCtx.drawImage(
        video,
        0,
        0,
        frozenCanvas.width,
        frozenCanvas.height
    );

    // Automatyczne wyłączenie flesza.
    await turnOffFlashlight();

    video.style.display = 'none';
    frozenCanvas.style.display = 'block';

    document.getElementById('status-label').innerText = 'MAM!!!';

    document.getElementById('status-text').classList.add('found');

    document.getElementById('reset-btn').style.display = 'block';

    document.getElementById('camera-box').classList.add('found');

    const cat = document.getElementById('cat-wrapper');

    cat.classList.remove('searching');
    cat.classList.add('found');

    document.getElementById('eyebrows-searching').style.display = 'none';
    document.getElementById('eyebrows-found').style.display = 'block';

    document.getElementById('eyes-searching').style.display = 'none';
    document.getElementById('eyes-found').style.display = 'block';

    document.getElementById('mouth-searching').style.display = 'none';
    document.getElementById('mouth-found').style.display = 'block';

    const infoCard = document.getElementById('info-card');
    const infoContent = document.getElementById('info-content');

    try {
        const result = calculateResistor(detections);

        let html =
            `<div class="info-row">Wartość: <span>${result.resistance}</span></div>`;

        html +=
            `<div class="info-row">Tolerancja: <span>${result.tolerance}</span></div>`;

        if (result.tempCoeff) {
            html +=
                `<div class="info-row">Współczynnik TK: <span>${result.tempCoeff}</span></div>`;
        }

        html +=
            `<hr style="border:0;border-top:1px solid #33334d;margin:8px 0;">`;

        html +=
            `<div class="info-row" style="font-size:13px;color:var(--text-muted);">Paski: ${result.orderedBands.map(b => b.label).join(', ')}</div>`;

        infoContent.innerHTML = html;

    } catch (err) {
        console.error('Błąd obliczania rezystancji:', err);

        infoContent.innerHTML =
            `<div class="info-row">Wykryto paski, ale ich układ wymaga sprawdzenia.</div>` +
            `<div class="info-row">Paski: ${detections.map(b => b.label).join(', ')}</div>`;
    }

    infoCard.style.display = 'block';

    document.getElementById('model-status').innerText =
        'Odczyt ustabilizowany • latarka wyłączona';
}

// PONOWNE SKANOWANIE

function resetScanner() {
    frozenCanvas.style.display = 'none';
    video.style.display = 'block';

    document.getElementById('info-card').style.display = 'none';

    stabilityBuffer = [];

    setSearchingUI();

    if (!isScanning) {
        isScanning = true;
        scanLoop();
    }
}

// INTERFEJS

function setSearchingUI() {
    document.getElementById('status-label').innerText = 'SZUKAM...';

    document.getElementById('status-text').classList.remove('found');

    document.getElementById('reset-btn').style.display = 'none';

    document.getElementById('camera-box').classList.remove('found');

    const cat = document.getElementById('cat-wrapper');

    cat.classList.remove('found');
    cat.classList.add('searching');

    document.getElementById('eyebrows-searching').style.display = 'block';
    document.getElementById('eyebrows-found').style.display = 'none';

    document.getElementById('eyes-searching').style.display = 'block';
    document.getElementById('eyes-found').style.display = 'none';

    document.getElementById('mouth-searching').style.display = 'block';
    document.getElementById('mouth-found').style.display = 'none';
}

window.addEventListener('pagehide', () => {
    isScanning = false;

    if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
    }
});

initApp();

</script>
