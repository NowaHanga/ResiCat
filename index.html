<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResiCat - Skaner Rezystorów</title>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/ort.min.js"></script>
    <style>
        :root {
            --bg-color: #161622;
            --card-bg: #222234;
            --accent-blue: #40c4ff;
            --accent-pink: #ff7eb3;
            --accent-mint: #4ecca3;
            --accent-yellow: #ffd369;
            --text-main: #ffffff;
            --text-muted: #a0a0b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .app-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 15px;
        }

        .app-title {
            font-size: 44px;
            font-weight: 900;
            letter-spacing: 6px;
            color: var(--text-main);
            margin: 0;
            text-transform: uppercase;
            display: flex;
            align-items: flex-end;
            text-shadow: 0 2px 20px rgba(64, 196, 255, 0.4);
        }

        .letter-i-container {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            margin: 0 -2px;
        }

        .cat-paw-dot {
            width: 24px;                  
            height: 22px;                 
            margin-bottom: 2px;           
            transform: rotate(12deg);     
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 5px;
            min-height: 45px;
            flex-wrap: wrap;
        }

        #status-text {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--accent-yellow);
            text-transform: uppercase;
            margin: 0;
            transition: color 0.3s;
        }

        #status-text.found {
            color: var(--accent-mint);
            text-shadow: 0 0 12px rgba(78, 204, 163, 0.4);
        }

        #reset-btn {
            display: none;
            background: var(--accent-pink);
            color: #161622;
            border: none;
            border-radius: 12px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 126, 179, 0.4);
            transition: transform 0.15s;
            text-transform: uppercase;
        }

        #reset-btn:active {
            transform: scale(0.95);
        }

        .cat-container {
            width: 240px;
            height: 160px;
            margin: 5px auto 10px auto;
        }

        @keyframes lookAroundSafe {
            0%, 100% { transform: translate(0px, 0px); }
            25% { transform: translate(-2px, 1px); }
            75% { transform: translate(2px, 1px); }
        }

        @keyframes happyEarLeft {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-10deg) translateY(-2px); }
        }

        @keyframes happyEarRight {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(10deg) translateY(-2px); }
        }

        @keyframes glowEyes {
            0%, 100% { filter: drop-shadow(0 0 2px var(--accent-mint)); transform: scale(1); }
            50% { filter: drop-shadow(0 0 10px var(--accent-mint)); transform: scale(1.05); }
        }

        @keyframes happyBlink {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        .searching .pupils-moving {
            animation: lookAroundSafe 2.4s ease-in-out infinite;
        }

        .found .ear-left-group {
            animation: happyEarLeft 0.8s ease-in-out infinite;
            transform-origin: 52px 38px;
        }
        .found .ear-right-group {
            animation: happyEarRight 0.8s ease-in-out infinite;
            transform-origin: 178px 38px;
        }

        .found .happy-eyes-anim {
            animation: glowEyes 1.5s ease-in-out infinite, happyBlink 1s ease-in-out infinite;
            transform-origin: center;
        }

        /* Naturalnie pochylone, symetryczne brwi w trybie sukcesu */
        .found .eyebrow-left-found {
            transform: translateY(-6px) rotate(-12deg);
            transform-origin: 70px 45px;
            transition: transform 0.3s ease;
        }
        .found .eyebrow-right-found {
            transform: translateY(-6px) rotate(12deg);
            transform-origin: 160px 45px;
            transition: transform 0.3s ease;
        }

        .camera-label {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .camera-box {
            position: relative;
            width: 100%;
            max-width: 340px;
            aspect-ratio: 4 / 3;
            background: #0d0d14;
            border-radius: 18px;
            border: 3px solid #33334d;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .camera-box.found {
            border-color: var(--accent-mint);
            box-shadow: 0 0 20px rgba(78, 204, 163, 0.35);
        }

        video, #frozen-frame {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        #frozen-frame {
            display: none;
        }

        #info-card {
            display: none;
            width: 100%;
            max-width: 340px;
            background: var(--card-bg);
            border-left: 5px solid var(--accent-mint);
            border-radius: 14px;
            padding: 16px 18px;
            margin-top: 18px;
            box-sizing: border-box;
            text-align: left;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .info-title {
            font-size: 16px;
            font-weight: 800;
            color: var(--accent-mint);
            letter-spacing: 1.5px;
            margin: 0 0 10px 0;
        }

        .info-row {
            font-size: 15px;
            margin: 6px 0;
            color: var(--text-main);
        }

        .info-row span {
            color: var(--accent-yellow);
            font-weight: 700;
        }

        #model-status {
            margin-top: 12px;
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
        }
    </style>
</head>
<body>

                    <path d="M 16 14 C 11 9, 6 12, 6 17 C 6 21, 11 25, 16 28 C 21 25, 26 21, 26 17 C 26 12, 21 9, 16 14 Z" fill="var(--accent-blue)"/>

                    <circle cx="13" cy="5" r="3.5" fill="var(--accent-blue)"/>

                I
            </span>CAT
        </h1>
    </header>
