<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResiCat - Skaner Rezystorów</title>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/ort.min.js"></script>
    <style>
        :root {
            --bg-color: #161622;
            --card-bg: #222234;
            --accent-blue: #40c4ff;
            --accent-pink: #ff7eb3;
            --accent-mint: #4ecca3;
            --accent-yellow: #ffd369;
            --text-main: #ffffff;
            --text-muted: #a0a0b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .app-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 10px;
        }

        .app-title {
            font-size: 44px;
            font-weight: 900;
            letter-spacing: 6px;
            color: var(--text-main);
            margin: 0;
            text-transform: uppercase;
            display: flex;
            align-items: flex-end;
            text-shadow: 0 2px 20px rgba(64, 196, 255, 0.4);
        }

        .letter-i-container {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            margin: 0 -2px;
        }

        .cat-paw-dot {
            width: 24px;
            height: 22px;
            margin-bottom: 2px;
            transform: rotate(12deg);
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        .controls-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 5px;
            min-height: 45px;
            flex-wrap: wrap;
            width: 100%;
            max-width: 340px;
        }

        #flashlight-btn {
            background: var(--card-bg);
            border: 2px solid #33334d;
            color: var(--text-muted);
            border-radius: 12px;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        #flashlight-btn.active {
            background: rgba(255, 211, 105, 0.15);
            border-color: var(--accent-yellow);
            color: var(--accent-yellow);
            box-shadow: 0 0 10px rgba(255, 211, 105, 0.3);
        }

        #status-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #status-text {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--accent-yellow);
            text-transform: uppercase;
            margin: 0;
            transition: color 0.3s;
        }

        #status-text.found {
            color: var(--accent-mint);
            text-shadow: 0 0 12px rgba(78, 204, 163, 0.4);
        }

        #reset-btn {
            display: none;
            background: var(--accent-pink);
            color: #161622;
            border: none;
            border-radius: 12px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 126, 179, 0.4);
            transition: transform 0.15s;
            text-transform: uppercase;
        }

        #reset-btn:active {
            transform: scale(0.95);
        }

        .cat-container {
            width: 240px;
            height: 160px;
            margin: 0 auto 5px auto;
        }

        @keyframes softTwitchLeft {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-6deg) translateY(-1px); }
        }

        @keyframes softTwitchRight {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(6deg) translateY(-1px); }
        }

        .ear-left-group {
            animation: softTwitchLeft 3s ease-in-out infinite;
            transform-origin: 52px 38px;
        }

        .ear-right-group {
            animation: softTwitchRight 3s ease-in-out infinite;
            transform-origin: 178px 38px;
        }

        .found .ear-left-group {
            animation: softTwitchLeft 1.2s ease-in-out infinite;
            transform-origin: 52px 38px;
        }

        .found .ear-right-group {
            animation: softTwitchRight 1.2s ease-in-out infinite;
            transform-origin: 178px 38px;
        }

        .camera-label {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .camera-box {
            position: relative;
            width: 100%;
            max-width: 340px;
            aspect-ratio: 4 / 3;
            background: #0d0d14;
            border-radius: 18px;
            border: 3px solid #33334d;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .camera-box.found {
            border-color: var(--accent-mint);
            box-shadow: 0 0 20px rgba(78, 204, 163, 0.35);
        }

        video, #frozen-frame {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        #frozen-frame {
            display: none;
        }

        #info-card {
            display: none;
            width: 100%;
            max-width: 340px;
            background: var(--card-bg);
            border-left: 5px solid var(--accent-mint);
            border-radius: 14px;
            padding: 16px 18px;
            margin-top: 15px;
            box-sizing: border-box;
            text-align: left;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .info-title {
            font-size: 16px;
            font-weight: 800;
            color: var(--accent-mint);
            letter-spacing: 1.5px;
            margin: 0 0 10px 0;
        }

        .info-row {
            font-size: 15px;
            margin: 6px 0;
            color: var(--text-main);
        }

        .info-row span {
            color: var(--accent-yellow);
            font-weight: 700;
        }

        #model-status {
            margin-top: 10px;
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
        }
    </style>
</head>
<body>
