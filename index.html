
<script>
"use strict";

/* ==========================================
   RESICAT – KONFIGURACJA
========================================== */

const CLASS_NAMES = [
    "Czarny",
    "Brązowy",
    "Czerwony",
    "Pomarańczowy",
    "Żółty",
    "Zielony",
    "Niebieski",
    "Fioletowy",
    "Szary",
    "Biały",
    "Złoty",
    "Srebrny",
    "Rezystor"
];

const COLOR_VALUES = {
    "Czarny":      { digit: 0, mult: 1 },
    "Brązowy":     { digit: 1, mult: 10, tol: 1, tempCoeff: 100 },
    "Czerwony":    { digit: 2, mult: 100, tol: 2, tempCoeff: 50 },
    "Pomarańczowy":{ digit: 3, mult: 1000, tempCoeff: 15 },
    "Żółty":       { digit: 4, mult: 10000, tempCoeff: 25 },
    "Zielony":     { digit: 5, mult: 100000, tol: 0.5, tempCoeff: 20 },
    "Niebieski":   { digit: 6, mult: 1000000, tol: 0.25, tempCoeff: 10 },
    "Fioletowy":   { digit: 7, mult: 10000000, tol: 0.1, tempCoeff: 5 },
    "Szary":       { digit: 8, mult: 100000000, tol: 0.05 },
    "Biały":       { digit: 9, mult: 1000000000 },
    "Złoty":       { mult: 0.1, tol: 5 },
    "Srebrny":     { mult: 0.01, tol: 10 }
};

const CONFIG = {
    size: 320,

    // Minimalna pewność wykrycia koloru
    colorConfidence: 0.52,

    // Minimalna pewność wykrycia rezystora
    resistorConfidence: 0.55,

    // Usuwanie nakładających się detekcji
    nmsThreshold: 0.45,

    // Stabilizacja
    stableFrames: 5,
    bufferSize: 9,
    maxAge: 1600,
    minStableTime: 350,

    // Tolerancja ruchu między klatkami
    positionToleranceX: 0.045,
    positionToleranceY: 0.055,

    // Geometria pasków
    minBandSpan: 0.10,
    maxBandSpan: 0.78,
    maxVerticalSpread: 0.12
};

let session = null;
let isScanning = false;
let scanBusy = false;

let mediaStream = null;
let torchOn = false;
let torchBusy = false;

let stabilityBuffer = [];
let lastCandidate = null;

const video = document.getElementById("webcam");
const frozenCanvas = document.getElementById("frozen-frame");
const aiCanvas = document.getElementById("ai-canvas");
const aiCtx = aiCanvas.getContext("2d", {
    willReadFrequently: true
});

/* ==========================================
   INICJALIZACJA
========================================== */

async function initApp() {
    try {
        document.getElementById("model-status").innerText =
            "Uruchamianie aparatu...";

        await startCamera();

        document.getElementById("model-status").innerText =
            "Ładowanie modelu AI...";

        ort.env.wasm.wasmPaths =
            "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/";

        ort.env.wasm.numThreads = 1;

        session = await ort.InferenceSession.create("./best.onnx");

        console.log("Model ONNX załadowany.");
        console.log("Wejście:", session.inputNames);
        console.log("Wyjście:", session.outputNames);

        document.getElementById("model-status").innerText =
            "Model AI gotowy! Przytrzymaj rezystor przed kamerą.";

        setSearchingUI();

    } catch (error) {
        console.error("Błąd inicjalizacji:", error);

        document.getElementById("model-status").innerText =
            "Błąd: " + error.message;
    }
}

/* ==========================================
   KAMERA
========================================== */

async function startCamera() {
    try {
        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {
            throw new Error("Przeglądarka nie obsługuje kamery.");
        }

        mediaStream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: {
                facingMode: { ideal: "environment" },
                width: { ideal: 1280 },
                height: { ideal: 960 }
            }
        });

        video.srcObject = mediaStream;

        await video.play();

        console.log("Kamera uruchomiona.");

    } catch (error) {
        console.error("Błąd kamery:", error);

        document.getElementById("status-text").innerText =
            "BŁĄD KAMERY";

        throw error;
    }
}

/* ==========================================
   LATARKA
========================================== */

async function toggleFlashlight() {
    if (!mediaStream || torchBusy || !isScanning) return;

    const track = mediaStream.getVideoTracks()[0];

    const capabilities = track.getCapabilities
        ? track.getCapabilities()
        : {};

    if (!capabilities.torch) {
        alert("Twoje urządzenie nie obsługuje latarki przez przeglądarkę.");
        return;
    }

    torchBusy = true;

    const newState = !torchOn;

    try {
        await track.applyConstraints({
            advanced: [{ torch: newState }]
        });

        torchOn = newState;
        updateFlashlightUI();

    } catch (error) {
        console.error("Błąd latarki:", error);

    } finally {
        torchBusy = false;
    }
}

async function turnOffFlashlight() {
    if (!mediaStream || !torchOn) return;

    const track = mediaStream.getVideoTracks()[0];

    try {
        if (track && track.readyState === "live") {
            await track.applyConstraints({
                advanced: [{ torch: false }]
            });
        }

    } catch (error) {
        console.warn("Błąd wyłączania latarki:", error);

    } finally {
        torchOn = false;
        updateFlashlightUI();
    }
}

function updateFlashlightUI() {
    const button = document.getElementById("flashlight-btn");

    if (!button) return;

    button.classList.toggle("active", torchOn);
    button.setAttribute("aria-pressed", String(torchOn));
}

/* ==========================================
   INTERFEJS – SZUKANIE
========================================== */

function setSearchingUI() {
    document.getElementById("status-text").innerText = "SZUKAM";
    document.getElementById("status-text").classList.remove("found");

    document.getElementById("cat-loading").style.display = "none";
    document.getElementById("cat-face").style.display = "flex";

    document.getElementById("cat-mouth").innerHTML = "▲<br>:3";

    stabilityBuffer = [];
    lastCandidate = null;

    isScanning = true;

    scanLoop();
}

/* ==========================================
   PĘTLA SKANOWANIA
========================================== */

function scheduleNextScan(delay = 80) {
    if (!isScanning) return;

    setTimeout(() => {
        requestAnimationFrame(scanLoop);
    }, delay);
}

async function scanLoop() {
    if (!isScanning || scanBusy) return;

    if (!session ||
        video.readyState < HTMLMediaElement.HAVE_ENOUGH_DATA) {

        scheduleNextScan(150);
        return;
    }

    scanBusy = true;

    try {
        aiCtx.drawImage(
            video,
            0,
            0,
            CONFIG.size,
            CONFIG.size
        );

        const image = aiCtx.getImageData(
            0,
            0,
            CONFIG.size,
            CONFIG.size
        ).data;

        const plane = CONFIG.size * CONFIG.size;

        const inputData = new Float32Array(3 * plane);

        for (let i = 0; i < plane; i++) {
            inputData[i] = image[i * 4] / 255;
            inputData[i + plane] = image[i * 4 + 1] / 255;
            inputData[i + plane * 2] = image[i * 4 + 2] / 255;
        }

        const tensor = new ort.Tensor(
            "float32",
            inputData,
            [1, 3, CONFIG.size, CONFIG.size]
        );

        const feeds = {};
        feeds[session.inputNames[0]] = tensor;

        const results = await session.run(feeds);

        const outputTensor = results[session.outputNames[0]];

        const detections = parseYOLOOutput(
            outputTensor.data,
            outputTensor.dims
        );

        const candidate = findBestBandGroup(detections);

        updateStability(candidate);

        const stableGroup = getStableGroup();

        if (stableGroup) {
            await handleResistorFound(stableGroup);
            return;
        }

    } catch (error) {
        console.error("Błąd skanowania:", error);

        // Pojedynczy błąd lub brak detekcji nie kasuje całego bufora.
        updateStability(null);

    } finally {
        scanBusy = false;
    }

    scheduleNextScan(80);
}

/* ==========================================
   ODCZYT WYJŚCIA YOLO
========================================== */

function parseYOLOOutput(data, dims) {
    if (!dims || dims.length !== 3) {
        throw new Error(
            "Nieprawidłowe wymiary modelu: " + JSON.stringify(dims)
        );
    }

    let features;
    let anchors;
    let featureMajor;

    if (dims[1] === 17 || dims[1] === 18) {
        features = dims[1];
        anchors = dims[2];
        featureMajor = true;

    } else if (dims[2] === 17 || dims[2] === 18) {
        features = dims[2];
        anchors = dims[1];
        featureMajor = false;

    } else {
        throw new Error(
            "Nieobsługiwany format wyjścia YOLO: " +
            JSON.stringify(dims)
        );
    }

    // 17 cech: 4 współrzędne + 13 klas.
    // 18 cech: 4 współrzędne + objectness + 13 klas.
    const hasObjectness = features === 18;
    const classOffset = hasObjectness ? 5 : 4;

    function read(anchor, feature) {
        return featureMajor
            ? data[feature * anchors + anchor]
            : data[anchor * features + feature];
    }

    const detections = [];

    for (let i = 0; i < anchors; i++) {
        let bestScore = 0;
        let classId = -1;

        const objectness = hasObjectness ? read(i, 4) : 1;

        for (let c = 0; c < CLASS_NAMES.length; c++) {
            const score = read(i, classOffset + c);

            if (score > bestScore) {
                bestScore = score;
                classId = c;
            }
        }

        if (classId < 0) continue;

        const confidence = bestScore * objectness;

        const label = CLASS_NAMES[classId];

        const threshold = label === "Rezystor"
            ? CONFIG.resistorConfidence
            : CONFIG.colorConfidence;

        if (confidence < threshold) continue;

        let cx = read(i, 0);
        let cy = read(i, 1);
        let w = read(i, 2);
        let h = read(i, 3);

        if (![cx, cy, w, h].every(Number.isFinite)) continue;

        // Współrzędne mogą być znormalizowane do zakresu 0–1.
        if (
            Math.max(
                Math.abs(cx),
                Math.abs(cy),
                Math.abs(w),
                Math.abs(h)
            ) <= 2
        ) {
            cx *= CONFIG.size;
            cy *= CONFIG.size;
            w *= CONFIG.size;
            h *= CONFIG.size;
        }

        if (w <= 1 || h <= 1) continue;

        const detection = {
            label,
            classId,
            confidence,
            x: cx,
            y: cy,
            w,
            h,
            x1: cx - w / 2,
            x2: cx + w / 2,
            y1: cy - h / 2,
            y2: cy + h / 2
        };

        detections.push(detection);
    }

    return nonMaximumSuppression(
        detections,
        CONFIG.nmsThreshold
    );
}

/* ==========================================
   NMS – USUWANIE NAKŁADAJĄCYCH SIĘ BOXÓW
========================================== */

function boxIoU(a, b) {
    const x1 = Math.max(a.x1, b.x1);
    const y1 = Math.max(a.y1, b.y1);
    const x2 = Math.min(a.x2, b.x2);
    const y2 = Math.min(a.y2, b.y2);

    const intersection =
        Math.max(0, x2 - x1) *
        Math.max(0, y2 - y1);

    const union =
        a.w * a.h +
        b.w * b.h -
        intersection;

    return union > 0 ? intersection / union : 0;
}

function nonMaximumSuppression(detections, threshold) {
    const sorted = [...detections].sort(
        (a, b) => b.confidence - a.confidence
    );

    const kept = [];

    for (const detection of sorted) {
        // Osobne NMS dla każdego koloru.
        // Dzięki temu dwa czerwone paski nie zostaną usunięte.
        const duplicate = kept.some(item =>
            item.classId === detection.classId &&
            boxIoU(item, detection) > threshold
        );

        if (!duplicate) {
            kept.push(detection);
        }
    }

    return kept;
}

/* ==========================================
   GEOMETRIA PASKÓW
========================================== */

function findBestBandGroup(detections) {
    const bands = detections
        .filter(d => d.label !== "Rezystor")

        // Odrzucanie obiektów przy samych krawędziach.
        .filter(d => d.x1 >= 8 && d.x2 <= CONFIG.size - 8)
        .filter(d => d.y1 >= 5 && d.y2 <= CONFIG.size - 5)

        // Paski powinny być pionowe.
        .filter(d => d.h >= 4 && d.w >= 2)
        .filter(d => d.h / d.w >= 0.65)

        .sort((a, b) => a.x - b.x);

    if (bands.length < 3) return null;

    const groups = [];

    // Sprawdzamy grupy od 3 do 6 pasków.
    for (
        let count = 3;
        count <= Math.min(6, bands.length);
        count++
    ) {
        for (
            let start = 0;
            start <= bands.length - count;
            start++
        ) {
            const group = bands.slice(start, start + count);

            const geometry = validateBandGeometry(group);

            if (!geometry.valid) continue;

            const confidence =
                group.reduce((sum, b) => sum + b.confidence, 0) /
                group.length;

            groups.push({
                bands: group,
                labels: group.map(b => b.label),
                xs: group.map(b => b.x / CONFIG.size),
                ys: group.map(b => b.y / CONFIG.size),
                score: geometry.score + confidence
            });
        }
    }

    groups.sort((a, b) => b.score - a.score);

    return groups[0] || null;
}

function validateBandGeometry(group) {
    const xs = group.map(b => b.x);
    const ys = group.map(b => b.y);
    const heights = group.map(b => b.h);
    const widths = group.map(b => b.w);

    const span = xs[xs.length - 1] - xs[0];

    const ySpread = Math.max(...ys) - Math.min(...ys);

    const median = arr => {
        const sorted = [...arr].sort((a, b) => a - b);
        return sorted[Math.floor(sorted.length / 2)];
    };

    const gaps = xs.slice(1).map(
        (x, i) => x - xs[i]
    );

    const medianGap = median(gaps);
    const medianHeight = median(heights);
    const medianWidth = median(widths);

    // Całkowita szerokość układu pasków.
    if (span < CONFIG.size * CONFIG.minBandSpan) {
        return { valid: false };
    }

    if (span > CONFIG.size * CONFIG.maxBandSpan) {
        return { valid: false };
    }

    // Paski muszą znajdować się mniej więcej w jednej linii.
    if (ySpread > CONFIG.size * CONFIG.maxVerticalSpread) {
        return { valid: false };
    }

    // Odległości między paskami.
    if (medianGap < 5) return { valid: false };

    if (Math.max(...gaps) > medianGap * 2.8) {
        return { valid: false };
    }

    // Szerokość boxa paska nie powinna być większa od jego odstępu.
    if (medianWidth > medianGap * 1.3) {
        return { valid: false };
    }

    // Zbliżona wysokość pasków.
    if (medianHeight < 4 || medianHeight > CONFIG.size * 0.55) {
        return { valid: false };
    }

    if (
        Math.max(...heights) /
        Math.max(1, Math.min(...heights)) > 3
    ) {
        return { valid: false };
    }

    if (
        Math.max(...widths) /
        Math.max(1, Math.min(...widths)) > 4
    ) {
        return { valid: false };
    }

    // Sprawdzenie regularności odstępów.
    const gapVariation = gaps.reduce(
        (sum, gap) => sum + Math.abs(gap - medianGap),
        0
    ) / gaps.length;

    const score =
        1 -
        ySpread / (CONFIG.size * CONFIG.maxVerticalSpread) -
        gapVariation / Math.max(1, medianGap);

    return {
        valid: true,
        score
    };
}

/* ==========================================
   STABILIZACJA – BUFOR KLATEK
========================================== */

function updateStability(candidate) {
    stabilityBuffer.push({
        time: Date.now(),
        group: candidate ? {
            labels: [...candidate.labels],
            xs: [...candidate.xs],
            ys: [...candidate.ys],
            bands: candidate.bands.map(b => ({ ...b }))
        } : null
    });

    trimStabilityBuffer();
}

function trimStabilityBuffer() {
    const cutoff = Date.now() - CONFIG.maxAge;

    stabilityBuffer = stabilityBuffer
        .filter(frame => frame.time >= cutoff)
        .slice(-CONFIG.bufferSize);
}

function groupsMatch(a, b) {
    if (!a || !b) return false;

    if (a.labels.length !== b.labels.length) return false;

    for (let i = 0; i < a.labels.length; i++) {
        // Kolejność kolorów musi być zgodna.
        if (a.labels[i] !== b.labels[i]) return false;

        // Dopuszczamy niewielkie przesunięcia ręki.
        if (
            Math.abs(a.xs[i] - b.xs[i]) >
            CONFIG.positionToleranceX
        ) {
            return false;
        }

        if (
            Math.abs(a.ys[i] - b.ys[i]) >
            CONFIG.positionToleranceY
        ) {
            return false;
        }
    }

    return true;
}

function getStableGroup() {
    const validFrames = stabilityBuffer.filter(
        frame => frame.group !== null
    );

    if (validFrames.length < CONFIG.stableFrames) {
        return null;
    }

    const latest = validFrames[validFrames.length - 1];

    // Porównujemy ostatnie wyniki z najnowszą klatką.
    const matching = validFrames.filter(frame =>
        groupsMatch(frame.group, latest.group)
    );

    if (matching.length < CONFIG.stableFrames) {
        return null;
    }

    const selected = matching.slice(-CONFIG.stableFrames);

    const elapsed =
        selected[selected.length - 1].time -
        selected[0].time;

    if (elapsed < CONFIG.minStableTime) {
        return null;
    }

    // Uśrednianie pozycji pasków.
    const count = latest.group.bands.length;
    const averagedBands = [];

    for (let i = 0; i < count; i++) {
        const samples = selected.map(
            frame => frame.group.bands[i]
        );

        const average = key =>
            samples.reduce(
                (sum, band) => sum + band[key], 0
            ) / samples.length;

        averagedBands.push({
            ...samples[samples.length - 1],
            x: average("x"),
            y: average("y"),
            w: average("w"),
            h: average("h"),
            confidence: average("confidence")
        });
    }

    return averagedBands;
}

/* ==========================================
   OBLICZANIE REZYSTANCJI
========================================== */

function calculateResistor(bands) {
    const ordered = [...bands].sort(
        (a, b) => a.x - b.x
    );

    if (ordered.length < 3 || ordered.length > 6) {
        throw new Error("Nieprawidłowa liczba pasków.");
    }

    // Złoty i srebrny zwykle oznaczają tolerancję.
    if (
        ordered.length >= 4 &&
        (
            ordered[0].label === "Złoty" ||
            ordered[0].label === "Srebrny"
        )
    ) {
        ordered.reverse();
    }

    const digitCount = ordered.length >= 5 ? 3 : 2;

    const digits = ordered
        .slice(0, digitCount)
        .map(b => COLOR_VALUES[b.label]?.digit);

    if (digits.some(value => value === undefined)) {
        throw new Error("Nieprawidłowy kolor cyfry.");
    }

    const multiplier =
        COLOR_VALUES[ordered[digitCount].label]?.mult;

    if (multiplier === undefined) {
        throw new Error("Nieprawidłowy kolor mnożnika.");
    }

    let numericDigits = 0;

    for (const digit of digits) {
        numericDigits = numericDigits * 10 + digit;
    }

    const ohms = numericDigits * multiplier;

    let tolerance = "±20%";
    let tempCoeff = null;

    if (ordered.length >= 4) {
        const toleranceColor = ordered[digitCount + 1]?.label;

        const toleranceValue =
            COLOR_VALUES[toleranceColor]?.tol;

        if (toleranceValue === undefined) {
            throw new Error("Nieprawidłowy pasek tolerancji.");
        }

        tolerance = `±${toleranceValue}%`;
    }

    if (ordered.length === 6) {
        const tc = COLOR_VALUES[ordered[5].label]?.tempCoeff;

        if (tc !== undefined) {
            tempCoeff = `${tc} ppm/°C`;
        }
    }

    let formatted = `${ohms} Ω`;

    if (ohms >= 1000000) {
        formatted =
            `${(ohms / 1000000).toFixed(ohms % 1000000 === 0 ? 0 : 2)} MΩ`;
    } else if (ohms >= 1000) {
        formatted =
            `${(ohms / 1000).toFixed(ohms % 1000 === 0 ? 0 : 2)} kΩ`;
    }

    return {
        resistance: formatted,
        tolerance,
        tempCoeff,
        orderedBands: ordered
    };
}

/* ==========================================
   SUKCES – MAM!!!
========================================== */

async function handleResistorFound(detections) {
    if (!isScanning) return;

    // Zatrzymujemy pętlę.
    isScanning = false;
    stabilityBuffer = [];

    // Zamrażamy ostatnią klatkę.
    frozenCanvas.width = video.videoWidth || CONFIG.size;
    frozenCanvas.height = video.videoHeight || CONFIG.size;

    const fCtx = frozenCanvas.getContext("2d");

    fCtx.drawImage(
        video,
        0,
        0,
        frozenCanvas.width,
        frozenCanvas.height
    );

    // Gasimy latarkę dopiero po skopiowaniu obrazu.
    await turnOffFlashlight();

    video.style.display = "none";
    frozenCanvas.style.display = "block";

    const status = document.getElementById("status-text");

    status.innerText = "MAM!!!";
    status.classList.add("found");

    document.getElementById("reset-btn").style.display = "block";

    document.getElementById("camera-box").classList.add("found");

    // Zadowolony kotek.
    document.getElementById("cat-mouth").innerHTML = "▲<br>😼";

    const infoContent = document.getElementById("info-content");

    let html = "";

    try {
        const result = calculateResistor(detections);

        html += `
            <div class="info-row">
                Wartość: <span>${result.resistance}</span>
            </div>
            <div class="info-row">
                Tolerancja: <span>${result.tolerance}</span>
            </div>
        `;

        if (result.tempCoeff) {
            html += `
                <div class="info-row">
                    Współczynnik TK: <span>${result.tempCoeff}</span>
                </div>
            `;
        }

        html += `
            <hr style="border:0;border-top:1px solid #33334d;margin:8px 0;">
            <div class="info-row">
                Paski:
                <span>${result.orderedBands.map(b => b.label).join(", ")}</span>
            </div>
        `;

    } catch (error) {
        console.error("Błąd obliczania:", error);

        html += `
            <div class="info-row">
                Wykryto paski, ale nie udało się poprawnie obliczyć wartości.
            </div>
            <div class="info-row">
                Paski:
                <span>${detections.map(b => b.label).join(", ")}</span>
            </div>
        `;
    }

    infoContent.innerHTML = html;

    document.getElementById("info-card").style.display = "block";

    document.getElementById("model-status").innerText =
        "Odczyt zakończony • latarka wyłączona";
}

/* ==========================================
   RESET
========================================== */

function resetScanner() {
    frozenCanvas.style.display = "none";
    video.style.display = "block";

    document.getElementById("info-card").style.display = "none";

    document.getElementById("status-text").classList.remove("found");

    document.getElementById("reset-btn").style.display = "none";

    document.getElementById("camera-box").classList.remove("found");

    document.getElementById("cat-mouth").innerHTML = "▲<br>:3";

    stabilityBuffer = [];
    lastCandidate = null;

    setSearchingUI();
}
